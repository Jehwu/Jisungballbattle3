<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JS BALL BATTLE3</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Cinzel:wght@700&family=Russo+One&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="p" id="p0"><div class="hd"><canvas class="ic"></canvas><div class="nm"><b></b><em id="n0">100</em></div></div><div class="bar"><u></u><i></i></div><div class="rw"><div class="ug"><i></i></div><div class="sk"></div></div></div>
  <div class="p r" id="p1"><div class="hd"><canvas class="ic"></canvas><div class="nm"><b></b><em id="n1">100</em></div></div><div class="bar"><u></u><i></i></div><div class="rw"><div class="ug"><i></i></div><div class="sk"></div></div></div>
  <div class="p r" id="p2"><div class="hd"><canvas class="ic"></canvas><div class="nm"><b></b><em id="n2">100</em></div></div><div class="bar"><u></u><i></i></div><div class="rw"><div class="ug"><i></i></div><div class="sk"></div></div></div>
</div>
<button id="snd">🔊</button>
<div id="ctl"><button id="bexit">✕ 나가기</button><button id="bskip">SKIP ⏭</button></div>
<div id="cfm"><div class="cbox"><b>경기를 나갈까요?</b><small id="cfms"></small><div class="btns" style="justify-content:center"><button class="btn" id="cno">취소</button><button class="btn pri" id="cyes">나가기</button></div></div></div>
<div id="msg"><div id="mt"></div><div class="btns"><button class="btn pri" id="go">REMATCH</button><button class="btn" id="home">MENU</button><button class="btn pri gold" id="tnext" style="display:none">BRACKET</button></div></div>
<div id="bracket"><div class="bh"><div class="bt gt">JS CHAMPIONS</div><div class="bs" id="bsub"></div></div><div id="brounds"></div><div id="bmatches"></div><div class="mf"><button class="btn" id="bquit">QUIT</button><button class="btn pri gold" id="bnext">NEXT MATCH</button></div></div>
<div id="champ"><div class="cl gt">CHAMPION</div><div class="cn" id="cname"></div><div class="cs">JS BALL BATTLE3 · CHAMPIONS</div><div class="btns" style="margin-top:20px"><button class="btn" id="cmenu">MENU</button><button class="btn pri gold" id="cagain">NEW TOURNAMENT</button></div></div>
<div id="hub" class="scr"><div><div class="logo"><span>JS</span> BALL BATTLE <em>3</em></div><div class="sub">AUTO BATTLE ARENA</div></div><div class="hbtns"><button class="hb pri" id="hplay"><b>게임 시작</b><small>PLAY</small></button><button class="hb" id="hdict"><b>사전</b><small>CODEX</small></button><button class="hb" id="hset"><b>설정</b><small>SETTINGS</small></button></div><div id="sdbg"></div></div>
<div id="modes" class="scr"><div class="sh"><button class="back" data-b="home">‹</button><b>모드 선택</b></div><div class="mlist"><button class="mc" data-m="2"><i>1 : 1</i><b>1대1</b><small>두 캐릭터의 정면 승부</small></button><button class="mc" data-m="3"><i>1:1:1</i><b>3인 난투</b><small>셋이 동시에 싸우는 혼전</small></button><button class="mc gold" data-m="T"><i>CUP</i><b>토너먼트</b><small>8강 · 16강 블랙골드 대회</small></button></div></div>
<div id="set" class="scr"><div class="sh"><button class="back" data-b="home">‹</button><b>설정 · 사운드</b></div><div id="sgrid"></div></div>
<div id="dict" class="scr"><div class="sh"><button class="back" data-b="home">‹</button><b>캐릭터 사전</b></div><div id="dgrid"></div></div>
<div id="dinfo" class="scr"><div class="sh"><button class="back" data-b="dict">‹</button><b id="dname"></b></div><div class="dtop"><canvas id="dic"></canvas><canvas id="dhex"></canvas></div><div id="dsk"></div></div>
<div id="demo"><div class="dbar"><div><small id="demot"></small><b id="demon"></b></div><button id="dclose">✕</button></div><div id="demod"></div></div>
<div id="menu">
  <div class="sh"><button class="back" data-b="modes">‹</button><b id="mtitle">캐릭터 선택</b></div>
  <div id="tsetup"><div id="tsize"><button data-t="8" class="on">8강</button><button data-t="16">16강</button></div><div id="tslots"></div></div>
  <section id="slots">
    <div class="slot on" data-s="0"><small>P1</small><canvas class="ic"></canvas><b></b><ul></ul></div>
    <div class="vsm">VS</div>
    <div class="slot" data-s="1"><small>P2</small><canvas class="ic"></canvas><b></b><ul></ul></div>
    <div class="vsm v3">VS</div>
    <div class="slot s3" data-s="2"><small>P3</small><canvas class="ic"></canvas><b></b><ul></ul></div>
  </section>
  <div id="vrow"></div>
  <section id="roster"><div class="rt">SELECT<span id="hint">P1 선택 중</span></div><div id="grid"></div></section>
  <div class="mf"><button class="btn" id="rand">RANDOM</button><button class="btn pri" id="start">FIGHT</button></div>
</div>
<script src="audio.js"></script>
<script src="game1.js"></script>
<script src="game2.js"></script>
<script src="game3.js"></script>
<script src="game4.js"></script>
<script src="game5.js"></script>
<script src="game6.js"></script>
<script src="sfxgen.js"></script>
</body>
</html>
